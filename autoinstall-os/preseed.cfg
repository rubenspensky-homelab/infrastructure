# Debian preseed for a minimal ops-managed host.
# Replace the password hash below before building the ISO.

d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select latam
d-i keyboard-configuration/layoutcode string latam
d-i keyboard-configuration/variantcode string
d-i console-keymaps-at/keymap select la-latin1

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-ops
d-i netcfg/get_domain string

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Ops
d-i passwd/username string ops
d-i passwd/user-password-crypted password $6$XH78CBCJNfK6Avcl$rQVuL1lxzPwA5u6yawmQ782y9Ol9cIUhdIk5ZY.hHGZRcz6RDamaaOsFlyZ76CIirI2u7NLtt/XtvnP7mkkmL0
d-i passwd/user-default-groups string sudo

d-i clock-setup/utc boolean true
d-i time/zone string America/Mexico_City
d-i clock-setup/ntp boolean true

d-i partman/early_command string \
  TARGET_SERIAL='PNY4519191104030431D'; DISK=''; \
  for link in /dev/disk/by-id/*""$TARGET_SERIAL""*; do \
    [ -e ""$link"" ] || continue; real=""$(readlink -f ""$link"")""; \
    [ -b ""$real"" ] || continue; base=""$(basename ""$real"")""; \
    case ""$base"" in sd*[0-9]|vd*[0-9]|xvd*[0-9]|nvme*n*p[0-9]) continue ;; esac; \
    DISK=""$real""; break; \
  done; \
  if [ -z ""$DISK"" ]; then \
    for dev in /dev/nvme*n1 /dev/sd? /dev/vd? /dev/xvd?; do \
      [ -b ""$dev"" ] || continue; base=""$(basename ""$dev"")""; \
      [ -r "/sys/block/""$base""/removable" ] && [ ""$(cat "/sys/block/""$base""/removable")"" = 1 ] && continue; \
      DISK=""$dev""; break; \
    done; \
  fi; \
  [ -n ""$DISK"" ] || exit 1; \
  debconf-set partman-auto/disk ""$DISK""; \
  debconf-set grub-installer/bootdev ""$DISK""

d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select k8s-no-swap
# NOTE: On k8s-control-01, booting the installer USB in Legacy/BIOS mode can
# install legacy GRUB even though this recipe creates /boot/efi. Boot the
# installer explicitly in UEFI mode and disable CSM/Legacy boot if needed.
d-i partman-auto/expert_recipe string \
  k8s-no-swap :: \
    1024 1024 1024 fat32 \
      $primary{ } \
      method{ efi } \
      format{ } \
      mountpoint{ /boot/efi } \
    . \
    10240 50000 -1 ext4 \
      $primary{ } \
      method{ format } \
      format{ } \
      use_filesystem{ } \
      filesystem{ ext4 } \
      mountpoint{ / } \
    .
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-basicfilesystems/no_swap boolean false
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false
d-i apt-setup/non-free boolean false

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo python3 openssh-server ca-certificates curl
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

d-i finish-install/reboot_in_progress note

d-i preseed/late_command string \
  mkdir -p /target/home/ops/.ssh; \
  echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPfD2YhMCW7OW14DPge0FzATuPPZ1J805fkRYDSCU04w" > /target/home/ops/.ssh/authorized_keys; \
  chown -R 1000:1000 /target/home/ops/.ssh; \
  chmod 700 /target/home/ops/.ssh; \
  chmod 600 /target/home/ops/.ssh/authorized_keys; \
  mkdir -p /target/etc/ssh/sshd_config.d; \
  echo "PasswordAuthentication no" > /target/etc/ssh/sshd_config.d/99-homelab.conf; \
  echo "KbdInteractiveAuthentication no" >> /target/etc/ssh/sshd_config.d/99-homelab.conf; \
  echo "ChallengeResponseAuthentication no" >> /target/etc/ssh/sshd_config.d/99-homelab.conf; \
  echo "PubkeyAuthentication yes" >> /target/etc/ssh/sshd_config.d/99-homelab.conf; \
  echo "PermitRootLogin no" >> /target/etc/ssh/sshd_config.d/99-homelab.conf; \
  echo "ops ALL=(ALL) NOPASSWD:ALL" > /target/etc/sudoers.d/ops; \
  chmod 440 /target/etc/sudoers.d/ops

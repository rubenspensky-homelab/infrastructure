---
- name: Check if control plane is initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Initialize Kubernetes control plane
  ansible.builtin.command: >-
    kubeadm init
    --control-plane-endpoint={{ k8s_control_plane_endpoint }}
    --pod-network-cidr={{ pod_network_cidr }}
  when: not kubeadm_admin_conf.stat.exists
  changed_when: true

- name: Create kubeconfig directory for ops
  ansible.builtin.file:
    path: /home/ops/.kube
    state: directory
    owner: ops
    group: ops
    mode: "0755"

- name: Configure kubeconfig for ops
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ops/.kube/config
    owner: ops
    group: ops
    mode: "0600"
    remote_src: true

- name: Create worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_join_command
  changed_when: false

- name: Allow workloads on single-node control plane
  ansible.builtin.command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
  register: control_plane_taint
  changed_when: "'untainted' in control_plane_taint.stdout"
  failed_when: false
  when: allow_workloads_on_control_plane | default(false)
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
